[package]
name = "xdg-desktop-portal-cosmic"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = ["systemd"]
wgpu = ["libcosmic/wgpu"]
systemd = ["dep:tracing-journald"]

[workspace]
members = ["cosmic-portal-config"]

[dependencies]
anyhow = "1.0.102"
ashpd = "0.12"
# WMDE: use our forked file manager's file-chooser dialog instead of pop-os/cosmic-files.
cosmic-files = { package = "wmde-files", path = "../wmde-files", default-features = false, features = [
    "gvfs",
    "wayland",
] }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", rev = "32283d7" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "32283d7" }
futures = "0.3"
async-io = "2" # runtime-agnostic Timer for capture timeouts (works under tokio and block_on)
image = "0.25"
# wmde-bg renamed its config crate to `wmde-bg-config` (ships the `fun.wmde.Background`
# id); alias it back to the `cosmic-bg-config` key so `cosmic_bg_config::` imports keep
# resolving, and so the portal reads the same wallpaper state the wmde-bg daemon writes.
cosmic-bg-config = { package = "wmde-bg-config", path = "../wmde-bg/config" }
cosmic-portal-config = { path = "./cosmic-portal-config" }
memmap2 = "0.9.10"
# pipewire = { git = "https://github.com/pop-os/pipewire-rs" }
pipewire = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs", features = [
    "v0_3_33",
] }
png = "0.18"
reis = { version = "0.7", features = ["tokio"] }
rustix = { version = "1.1", features = ["fs", "time"] }
# spa_sys = { package = "libspa-sys", git = "https://github.com/pop-os/pipewire-rs" }
zbus = { version = "5.15.0", default-features = false, features = ["tokio"] }
gbm = "0.18.0"
wayland-protocols = "0.32.12"
dirs = "6.0.0"
jiff = "0.2"
url = "2.5"
# i18n
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8.11.0"
# Workspace
cosmic-config.workspace = true
serde.workspace = true
spa_sys = { package = "libspa-sys", git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs" }
pipewire-sys = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs" }
tempfile = "3.27.0"
tokio = { version = "1.52.1", features = ["macros", "net", "rt", "sync"] }
wayland-client = { version = "0.31.14" }
tracing = "0.1.44"
tracing-journald = { version = "0.3.2", optional = true }
tracing-subscriber = "0.3.23"
log-panics = { version = "2.1.0", features = ["with-backtrace"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
# TODO: a11y feature crashes file chooser dialog
default-features = false
features = [
    "autosize",
    "dbus-config",
    "desktop",
    "multi-window",
    "tokio",
    "wayland",
    "wgpu",
    "winit",
]

[workspace.dependencies]
cosmic-config = { git = "https://github.com/pop-os/libcosmic" }
log = "0.4.29"
serde = "1.0.228"

[dev-dependencies]
gst = { package = "gstreamer", version = "0.25.1" }
clap = { version = "4.6.1", features = ["derive"] }

# Build libcosmic/cosmic-config/cosmic-theme/iced from the local WMDE fork so the
# rebranded config-root and fun.wmde.* ids resolve. The portal reads color-scheme +
# accent through libcosmic TYPES (ThemeMode/CosmicTk/CosmicTheme), so building against
# our libcosmic makes the Settings portal serve fun.wmde config automatically.
[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { path = "../libcosmic" }
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
cosmic-theme = { path = "../libcosmic/cosmic-theme" }
iced = { path = "../libcosmic/iced" }
iced_accessibility = { path = "../libcosmic/iced/accessibility" }
iced_core = { path = "../libcosmic/iced/core" }
iced_debug = { path = "../libcosmic/iced/debug" }
iced_futures = { path = "../libcosmic/iced/futures" }
iced_graphics = { path = "../libcosmic/iced/graphics" }
iced_program = { path = "../libcosmic/iced/program" }
iced_renderer = { path = "../libcosmic/iced/renderer" }
iced_runtime = { path = "../libcosmic/iced/runtime" }
iced_tiny_skia = { path = "../libcosmic/iced/tiny_skia" }
iced_wgpu = { path = "../libcosmic/iced/wgpu" }
iced_widget = { path = "../libcosmic/iced/widget" }
iced_winit = { path = "../libcosmic/iced/winit" }

# Some transitive deps pin libcosmic/cosmic-config via the trailing-slash and .git URL
# variants; patch those too so a single (local) libcosmic resolves across the graph.
# WMDE: shared release profile, see .doc/perf.
#  - panic = "abort" drops .eh_frame and .gcc_except_table; catch_unwind stops catching,
#    which in this stack only guards SVG parsing in iced's vector backends.
#  - lto = "fat" with one codegen unit removes what monomorphisation duplicated.
# The LTO half is expensive and single threaded; FAST=1 turns it off for development
# builds without touching panic or opt-level, so behaviour still matches what ships.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
